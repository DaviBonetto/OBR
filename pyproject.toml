[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obr-oficial"
version = "0.1.0"
description = "Software oficial do robo OBR: percepcao, controle, resgate e painel."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Davi Bonetto" },
]
dependencies = []

[project.optional-dependencies]
captura = [
    "flask>=3.1,<4",
    "numpy>=2,<3",
    "opencv-python-headless>=4.13,<5",
    "waitress>=3.0,<4",
]
dados = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.13,<5",
]
desenvolvimento = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
obr-capturar = "obr_oficial.aplicacao.executar_captura:main"
obr-preparar-dataset = "obr_oficial.aplicacao.preparar_dataset:main"
obr-gerar-mascaras-classicas = "obr_oficial.aplicacao.gerar_mascaras_classicas:main"
obr-revisar-mascaras = "obr_oficial.aplicacao.revisar_mascaras:main"

[tool.setuptools]
package-dir = { "" = "codigo" }

[tool.setuptools.packages.find]
where = ["codigo"]

[tool.setuptools.package-data]
"obr_oficial.painel" = ["web/*.css", "web/*.html", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["codigo"]
testpaths = ["testes"]

[tool.ruff]
line-length = 100
src = ["codigo", "testes"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
