[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obr-oficial"
version = "0.1.0"
description = "Software oficial do robo OBR: percepcao, controle, resgate e painel."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Davi Bonetto" },
]
dependencies = []

[project.optional-dependencies]
captura = [
    "flask>=3.1,<4",
    "numpy>=2,<3",
    "opencv-python-headless>=4.13,<5",
    "waitress>=3.0,<4",
]
dados = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.13,<5",
]
treinamento = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]
implantacao = [
    "numpy>=2,<3",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "onnxscript>=0.2,<1",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]
percepcao = [
    "flask>=3.1,<4",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "opencv-python-headless>=4.13,<5",
    "waitress>=3.0,<4",
]
desenvolvimento = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
obr-capturar = "obr_oficial.aplicacao.executar_captura:main"
obr-consolidar-rotulos = "obr_oficial.aplicacao.consolidar_rotulos:main"
obr-consolidar-dataset-v2 = "obr_oficial.aplicacao.consolidar_dataset_v2:main"
obr-auditar-rotulos-fase3 = "obr_oficial.aplicacao.auditar_rotulos_fase3:main"
obr-exportar-fase3 = "obr_oficial.aplicacao.exportar_fase3:main"
obr-treinar-segmentacao = "obr_oficial.aplicacao.treinar_segmentacao:main"
obr-preparar-dataset = "obr_oficial.aplicacao.preparar_dataset:main"
obr-gerar-mascaras-classicas = "obr_oficial.aplicacao.gerar_mascaras_classicas:main"
obr-revisar-mascaras = "obr_oficial.aplicacao.revisar_mascaras:main"
obr-exportar-modelo-linha = "obr_oficial.aplicacao.exportar_modelo_linha:main"
obr-percepcao-linha = "obr_oficial.aplicacao.executar_percepcao_linha:main"
obr-avaliar-geometria-linha = "obr_oficial.aplicacao.avaliar_geometria_linha:main"
obr-referenciar-centro-fase4 = "obr_oficial.aplicacao.referenciar_centro_fase4:main"
obr-painel = "obr_oficial.painel.operacao.servidor:main"

[tool.setuptools]
package-dir = { "" = "codigo" }

[tool.setuptools.packages.find]
where = ["codigo"]

[tool.setuptools.package-data]
"obr_oficial.painel" = ["web/*.css", "web/*.html", "web/*.js"]
"obr_oficial.painel.operacao" = [
    "web/*.css",
    "web/*.html",
    "web/*.js",
    "web/*.png",
    "web/fontes/*.woff2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["codigo"]
testpaths = ["testes"]

[tool.ruff]
line-length = 100
src = ["codigo", "testes"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
