[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obr-oficial"
version = "0.1.0"
description = "Software oficial do robo OBR: percepcao, controle, resgate e painel."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Davi Bonetto" },
]
dependencies = []

[project.optional-dependencies]
desenvolvimento = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = { "" = "codigo" }

[tool.setuptools.packages.find]
where = ["codigo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["codigo"]
testpaths = ["testes"]

[tool.ruff]
line-length = 100
src = ["codigo", "testes"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
